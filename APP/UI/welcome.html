<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSE</title>
<style>
:root{
  --bg:#f4f5f8;--panel:#ffffff;--hover:#f0f1f6;--border:#e4e6ee;--border-strong:#d3d7e2;
  --text:#171a23;--muted:#5d6474;--faint:#98a0b3;--accent:#2563eb;--accent-soft:#eef3ff;
  --ok:#16a34a;--warn:#b45309;--warn-soft:#fffbeb;--warn-border:#fde68a;--danger:#dc2626;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171d;--panel:#1b1f28;--hover:#20252f;--border:#2b313d;--border-strong:#3a4250;
    --text:#e8eaf0;--muted:#a2a9b8;--faint:#6f7889;--accent:#5b8cff;--accent-soft:rgba(91,140,255,.16);
    --ok:#4ade80;--warn:#fbbf24;--warn-soft:rgba(217,119,6,.16);--warn-border:rgba(251,191,36,.35);}
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font-family:inherit}
button{cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .18s ease}
button:disabled{cursor:default;opacity:.55;transition:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 顶部：只有标题 + 一行副标题（可拖拽，原生窗口观感） */
.wel-head{display:flex;align-items:center;gap:12px;padding:24px 30px 14px;-webkit-app-region:drag;user-select:none;flex:0 0 auto}
.wel-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1d2433,#0f1420);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wel-logo svg{width:100%;height:100%}
.wel-titles{min-width:0}
.wel-title{font-size:16.5px;font-weight:700;letter-spacing:.2px}
.wel-sub{margin-top:3px;font-size:12px;color:var(--muted);line-height:1.5}

.wel-body{flex:1 1 auto;overflow-y:auto;padding:0 30px}
.wel-step[hidden]{display:none}
.wel-warn[hidden]{display:none}
.wel-warn{padding:9px 12px;border:1px solid var(--warn-border);border-radius:10px;background:var(--warn-soft);color:var(--text);font-size:12px;line-height:1.6;margin-bottom:12px}

/* 第 1 步：三张入口卡（单选即进入下一步），**不含任何输入框** */
.wel-choices{display:flex;flex-direction:column;gap:10px}
.wel-choice{display:flex;align-items:center;gap:13px;text-align:left;padding:15px 16px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);width:100%}
.wel-choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.wel-choice .wc-ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--accent)}
.wel-choice .wc-body{min-width:0}
.wel-choice .wc-t{display:block;font-size:13.5px;font-weight:600}
.wel-choice .wc-d{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
.wel-choice .wc-arrow{margin-left:auto;color:var(--faint);font-size:13px}

/* 第 2 步：只显示当前路径需要的字段 */
.wel-field{margin-bottom:12px}
.wel-field[hidden]{display:none}
.wel-field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.wel-field input,.wel-field select{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--panel);color:var(--text);font-size:13px}
.wel-err{display:block;margin-top:5px;font-size:11.5px;color:var(--danger);line-height:1.5}
.wel-msg{font-size:12.5px;line-height:1.6;color:var(--muted);margin-bottom:10px}
.wel-msg.ok{color:var(--ok)}
.wel-msg.bad{color:var(--danger)}
.wel-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:2px}

.wel-footnote{flex:0 0 auto;padding:0 30px 6px;font-size:11px;color:var(--faint);line-height:1.5}
.wel-foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 30px 18px;border-top:1px solid var(--border)}
.wel-foot .spacer{flex:1}
.wel-btn{padding:8px 14px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font-size:12.5px}
.wel-btn:hover{border-color:var(--border-strong)}
.wel-btn.pri{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600;min-width:132px}
.wel-btn.pri:hover{filter:brightness(1.05)}
.wel-btn[hidden]{display:none}
</style>
</head>
<body>
  <div class="wel-head">
    <div class="wel-logo"><svg viewBox="0 0 512 512" aria-label="ROSE" role="img"><g fill="none" stroke="#F4F1EA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path d="M200 146 V366"/><path d="M200 146 A58 58 0 0 1 200 262"/></g><path d="M200 262 L308 366" fill="none" stroke="#D16A80" stroke-width="32" stroke-linecap="round"/></svg></div>
    <div class="wel-titles">
      <div class="wel-title" id="welTitle" data-i18n="title">欢迎使用 ROSE</div>
      <div class="wel-sub" id="welSub" data-i18n="sub"></div>
    </div>
  </div>

  <div class="wel-body">
    <div class="wel-warn" id="welUnavailable" hidden></div>

    <!-- 第 1 步：选择入口（三张卡，单选即进入下一步；本屏无任何输入框） -->
    <div class="wel-step" id="welStep1">
      <div class="wel-choices" id="welChoices">
        <button class="wel-choice" type="button" data-choice="local">
          <span class="wc-ic">⌂</span>
          <span class="wc-body"><span class="wc-t" data-i18n="chooseLocal"></span><span class="wc-d" data-i18n="chooseLocalDesc"></span></span>
          <span class="wc-arrow">›</span>
        </button>
        <button class="wel-choice" type="button" data-choice="cloud">
          <span class="wc-ic">☁</span>
          <span class="wc-body"><span class="wc-t" data-i18n="chooseCloud"></span><span class="wc-d" data-i18n="chooseCloudDesc"></span></span>
          <span class="wc-arrow">›</span>
        </button>
        <button class="wel-choice" type="button" data-choice="later">
          <span class="wc-ic">→</span>
          <span class="wc-body"><span class="wc-t" data-i18n="chooseLater"></span><span class="wc-d" data-i18n="chooseLaterDesc"></span></span>
          <span class="wc-arrow">›</span>
        </button>
      </div>
    </div>

    <!-- 第 2 步 · 本地模型（Ollama）：进入即自动探测 -->
    <div class="wel-step" id="welStepLocal" hidden>
      <div class="wel-msg" id="welLocalMsg"></div>
      <div class="wel-field" id="welLocalModelWrap" hidden>
        <label for="welLocalModel" data-i18n="localModel"></label>
        <select id="welLocalModel"></select>
      </div>
      <div class="wel-err" id="welLocalErr"></div>
      <div class="wel-row"><button class="wel-btn" type="button" id="welUseCloud" data-i18n="useCloud"></button></div>
    </div>

    <!-- 第 2 步 · 云厂商 API Key -->
    <div class="wel-step" id="welStepCloud" hidden>
      <div class="wel-field">
        <label for="welPreset" data-i18n="cloudPreset"></label>
        <select id="welPreset"></select>
      </div>
      <div class="wel-field" id="welUrlWrap" hidden>
        <label for="welUrl" data-i18n="urlLabel"></label>
        <input type="text" id="welUrl" spellcheck="false" autocomplete="off" placeholder="https://api.example.com/v1">
        <span class="wel-err" id="welUrlErr"></span>
      </div>
      <div class="wel-field" id="welKeyWrap">
        <label for="welKey" data-i18n="cloudKey"></label>
        <input type="password" id="welKey" autocomplete="off" spellcheck="false" placeholder="sk-…">
        <span class="wel-err" id="welKeyErr"></span>
      </div>
      <div class="wel-field" id="welModelWrap" hidden>
        <label for="welModel" data-i18n="cloudModel"></label>
        <select id="welModel"></select>
        <span class="wel-err" id="welModelErr"></span>
      </div>
      <div class="wel-msg" id="welCloudNote"></div>
    </div>
  </div>

  <p class="wel-footnote" id="welFootNote" data-i18n="footNote"></p>

  <div class="wel-foot">
    <button class="wel-btn" type="button" id="welBack" data-i18n="back" hidden></button>
    <span class="spacer"></span>
    <button class="wel-btn pri" type="button" id="welPrimary" hidden></button>
  </div>

  <script src="./welcome.js"></script>
</body>
</html>
