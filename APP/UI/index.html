<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSE</title>
<style>
:root{--rose-ink:#12121a;--rose-accent:#d16a80;
  /* 基础色（冷灰阶 + 蓝 accent，比原 #f7f7f8/#18181b 略沉稳克制） */
  --bg:#f4f5f8; --panel:#ffffff; --hover:#f0f1f6; --active:#e8ebf3;
  --border:#e4e6ee; --border-strong:#d3d7e2;
  --text:#171a23; --muted:#5d6474; --faint:#98a0b3;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eef3ff;
  --ok:#16a34a; --ok-soft:#f0fdf4; --ok-border:#bbe7cc;
  --warn:#b45309; --warn-soft:#fffbeb; --warn-border:#fde68a;
  --danger:#dc2626;
  /* 层级 token：圆角两档、阴影四层、聚焦环（全站统一引用） */
  --radius:12px; --radius-lg:16px;
  --shadow-xs:0 1px 2px rgba(22,28,45,.05);
  --shadow-sm:0 2px 8px -2px rgba(22,28,45,.08),0 1px 2px rgba(22,28,45,.04);
  --shadow-md:0 8px 24px -6px rgba(22,28,45,.14),0 2px 6px rgba(22,28,45,.05);
  --shadow-lg:0 18px 48px -10px rgba(22,28,45,.20),0 4px 12px rgba(22,28,45,.06);
  --ring:0 0 0 3px rgba(37,99,235,.16);
  --focus:rgba(37,99,235,.55);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{font-family:inherit;transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .18s ease,transform .12s ease,opacity .15s ease}
button:disabled{transition:none}
::selection{background:rgba(37,99,235,.16)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
/* 细滚动条（全局柔和） */
*{scrollbar-width:thin;scrollbar-color:rgba(120,130,155,.38) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,130,155,.32);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(120,130,155,.55)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
.app{display:grid;grid-template-columns:264px 1fr;height:100vh}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ===== 侧栏 ===== */
.sidebar{background:#fbfbfc;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:14px 16px;display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--rose-ink,#12121a);overflow:hidden;box-shadow:0 1px 2px rgba(16,18,27,.16)}
.brand .logo .logo-mark{display:block}
.brand b{font-size:14px;font-weight:600}
.brand small{display:block;font-size:10.5px;color:var(--faint);font-weight:400;margin-top:1px}
.new-chat{margin:2px 12px 8px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--radius);border:1px dashed var(--border-strong);color:var(--muted);font-size:13px;cursor:pointer;background:var(--panel);position:relative}
.new-chat:hover{border-color:var(--accent);color:var(--accent)}
.new-chat .ic{width:14px;height:14px}
.role-picker{position:absolute;top:calc(100% + 6px);left:0;width:236px;background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 10px 30px rgba(24,24,27,.14);padding:5px;display:none;z-index:80}
.role-picker.show{display:block}
.rp-title{font-size:10.5px;color:var(--faint);padding:5px 9px 3px;text-transform:uppercase;letter-spacing:.5px}
.rp-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text)}
.rp-item:hover{background:var(--hover)}
.rp-item .rp-ic{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.rp-item .rp-d{font-size:11px;color:var(--faint);margin-top:1px}
.rp-item .rp-new{margin-left:auto;font-size:11px;color:var(--accent)}
.rp-sep{height:1px;background:var(--border);margin:4px 6px}
.session-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.role-group{margin:6px 8px 4px}
.rg-head{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
.rg-head:hover{background:var(--hover)}
.rg-head .rico{width:22px;height:22px;color:var(--muted);flex-shrink:0}
.rg-head .rname{font-size:13px;font-weight:600}
.rg-head .cnt{font-size:11px;color:var(--faint)}
.rg-head .ops{margin-left:auto;display:flex;gap:2px;opacity:0}
.rg-head:hover .ops{opacity:1}
.rg-head .chev{font-size:10px;color:var(--faint);flex-shrink:0;transition:transform .15s ease}
.role-group.collapsed .rg-head .chev{transform:rotate(-90deg)}
.rg-op{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:pointer}
.rg-op:hover{background:var(--panel);color:var(--text)}
.rg-op .ic{width:13px;height:13px}
.session-item{display:flex;align-items:center;gap:8px;margin:1px 10px 1px 39px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px}
.session-item:hover{background:var(--hover);color:var(--text)}
.session-item.active{background:var(--active);color:var(--text)}
.session-item .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .x{opacity:0;font-size:11px;color:var(--faint);padding:2px 4px;border-radius:4px}
.session-item:hover .x{opacity:1}
.session-item .x:hover{color:var(--danger)}

/* ===== 会话搜索 + 重命名 ===== */
.sess-search{position:relative;margin:2px 12px 8px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:0 9px;color:var(--faint)}
.sess-search .ss-ic{width:13px;height:13px;flex-shrink:0}
.sess-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:12.5px;padding:6px 0;color:var(--text);font-family:inherit}
.sess-search input::placeholder{color:var(--faint)}
.sess-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ss-clear{border:none;background:none;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 3px;line-height:1;flex-shrink:0}
.ss-clear:hover{color:var(--danger)}
.session-item .ops{display:flex;align-items:center;gap:2px;opacity:0;flex-shrink:0}
.session-item:hover .ops{opacity:1}
.session-item .ops .rn,.session-item .ops .x{font-size:11px;color:var(--faint);padding:1px 4px;border-radius:4px;cursor:pointer}
.session-item .ops .rn:hover{color:var(--accent);background:var(--panel)}
.session-item .ops .x:hover{color:var(--danger);background:var(--panel)}
.session-item .rn-input{flex:1;min-width:0;font-size:12.5px;font-family:inherit;color:var(--text);border:1px solid var(--accent);border-radius:5px;outline:none;padding:2px 6px;background:var(--panel)}
.session-empty{padding:22px 12px;text-align:center;color:var(--faint);font-size:12px}

/* ===== 侧栏底部 ===== */
.sidebar-foot{padding:7px 6px 6px;display:flex;flex-direction:column;gap:2px}
.settings-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px;border:none;background:transparent;font-family:inherit;text-align:left;width:100%}
.settings-btn:hover{background:var(--hover);color:var(--text)}
.settings-btn .ic{width:15px;height:15px;flex-shrink:0}
.settings-btn .gear-rot{transition:transform .25s}
.settings-btn:hover .gear-rot{transform:rotate(60deg)}
.settings-btn small{margin-left:auto;font-size:10px;color:var(--faint)}

/* ===== 主区 ===== */
.main{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 22px;border-bottom:1px solid var(--border);z-index:5}
.topbar .cicon{width:26px;height:26px;color:var(--muted)}
.topbar .title{font-size:14px;font-weight:600;line-height:1.2}
.topbar .sub{display:flex;align-items:center;gap:8px;margin-top:2px}
.topbar .role-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid #dbeafe;padding:1px 10px;border-radius:999px}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--border);padding:4px 12px;border-radius:999px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--ok);font-style:normal}

/* ===== 聊天 ===== */
.chatroom{flex:1;overflow-y:auto}
.wrap{max-width:800px;margin:0 auto;padding:26px 28px 12px}
.msg{margin-bottom:26px;display:flex;gap:12px}
.msg .avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.msg .avatar.u{background:#e4e4e7;color:#3f3f46;font-size:12px;font-weight:600}
.msg .avatar.a{background:var(--panel);border:1.5px solid var(--text);color:var(--text)}
.msg .avatar.a .ic{width:17px;height:17px}
.msg .col{flex:1;min-width:0}
.msg .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.msg .who{font-size:13px;font-weight:600}
.msg .time{font-size:11px;color:var(--faint)}
.msg .body{font-size:14px;line-height:1.75}
.msg .body p{margin:0 0 8px}
.msg .body p:last-child{margin-bottom:0}
.msg .body h1,.msg .body h2,.msg .body h3,.msg .body h4{margin:16px 0 8px;font-weight:600;line-height:1.4}
.msg .body h1{font-size:18px}.msg .body h2{font-size:16px}.msg .body h3{font-size:15px}.msg .body h4{font-size:14px}
.msg .body ul,.msg .body ol{margin:0 0 8px;padding-left:22px}
.msg .body li{margin:3px 0}
.msg .body blockquote{margin:0 0 8px;padding:2px 12px;border-left:3px solid var(--border-strong);color:var(--muted)}
.msg .body hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.msg .body a{color:var(--accent);text-decoration:none}
.msg .body a:hover{text-decoration:underline}
.msg .body pre{background:var(--hover);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 10px}
.msg .body pre code{display:block;background:none;padding:0;font-size:12.5px;line-height:1.6}
.msg .body table{border-collapse:collapse;margin:0 0 10px;width:100%;font-size:13px}
.msg .body th,.msg .body td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.msg .body th{background:var(--hover);font-weight:600}
.msg .body del{color:var(--faint)}
.msg .body code{font-family:var(--mono);font-size:12.5px;background:var(--hover);padding:2px 6px;border-radius:5px}
.tool-card{margin:10px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tool-card .th{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;user-select:none}
.tool-card .th:hover{background:var(--hover)}
.tool-card .tico{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.tool-card .tn{font-family:var(--mono);font-size:12.5px;font-weight:600}
.tool-card .ta{font-family:var(--mono);font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tool-card .st{font-size:11px;color:var(--muted);flex-shrink:0;display:flex;align-items:center;gap:5px}
.tool-card .st svg{width:12px;height:12px}
.tool-card .st.ok{color:var(--ok)}
.tool-card .st .spin{width:10px;height:10px;border:2px solid #dbeafe;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tool-card .tb{display:none;border-top:1px solid var(--border);background:#fafafb;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#3f3f46;white-space:pre-wrap;max-height:200px;overflow-y:auto}
.tool-card.open .tb{display:block}
.err-row{margin:12px 0;padding:10px 14px;border:1px solid #fecaca;background:#fef2f2;border-radius:var(--radius);font-size:13px;color:var(--danger)}
.btn{border-radius:8px;padding:6px 18px;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn.ghost-deny{color:var(--danger)}
.btn.ghost-deny:hover{background:#fef2f2}
.btn:disabled{opacity:.5;cursor:default}
.gen{display:flex;gap:12px;margin-bottom:26px}
.gen .avatar{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1.5px solid var(--text);color:var(--text);display:flex;align-items:center;justify-content:center}
.gen .avatar .ic{width:17px;height:17px}
.gen .col .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px}
.gen .spin{width:12px;height:12px;border:2px solid #dbeafe;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}

/* ===== 输入区 ===== */
.composer{padding:12px 28px 16px;background:linear-gradient(transparent,var(--panel) 26%)}
.composer .box{max-width:800px;margin:0 auto;background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:0 1px 4px rgba(24,24,27,.05);transition:border-color .15s}
.composer .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{width:100%;border:none;outline:none;resize:none;padding:13px 16px 4px;font-size:14px;font-family:inherit;line-height:1.6;background:transparent;color:var(--text)}
.composer .bar{display:flex;align-items:center;padding:6px 12px 10px;position:relative}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.model-select{font-size:12px;color:var(--text);border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;outline:none;font-family:inherit;max-width:230px}
.model-select:hover{border-color:var(--accent)}
.model-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.attach-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px}
.attach-btn:hover{background:var(--hover);color:var(--text);border-color:var(--accent)}
.attach-btn .ic{width:100%;height:100%}
.skill-btn{width:auto;padding:6px 9px;gap:6px;margin-right:auto;position:relative}
.skill-btn .ic{width:15px;height:15px}
.skill-count{font-size:10px;color:#fff;background:var(--accent);border-radius:999px;min-width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.skill-picker{position:absolute;left:14px;bottom:calc(100% + 6px);width:260px;background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 10px 30px rgba(24,24,27,.15);padding:6px;display:none;z-index:70;max-height:260px;overflow-y:auto}
.skill-picker.show{display:block}
.sp-title{font-size:10.5px;color:var(--faint);padding:5px 9px 3px;text-transform:uppercase;letter-spacing:.5px}
.sp-item{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 9px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;text-align:left}
.sp-item:hover{background:var(--hover)}
.sp-item input{margin-top:3px;accent-color:var(--accent);flex-shrink:0}
.sp-item > span{flex:1;min-width:0}
.sp-item .sp-name{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden}
.sp-item .sp-name .nm{overflow:hidden;text-overflow:ellipsis}
.sp-item .sp-desc{display:block;font-size:11px;color:var(--faint);margin-top:1px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-item .sp-scope{font-size:9.5px;color:var(--accent);border:1px solid #dbeafe;background:var(--accent-soft);border-radius:999px;padding:0 6px;margin-left:6px}
.sp-empty{padding:10px;font-size:12px;color:var(--faint);text-align:center}
.sk-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);border-radius:999px;padding:3px 6px 3px 10px;background:var(--accent-soft);font-size:11.5px;color:var(--accent)}
.sk-chip .sk-chip-x{border:none;background:none;cursor:pointer;color:var(--faint);font-size:12px;padding:0 2px;line-height:1}
.sk-chip .sk-chip-x:hover{color:var(--danger)}
.att-picks{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 6px}
.att-picks:empty{display:none}
.att-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:4px 6px 4px 4px;background:var(--panel);font-size:11.5px;color:var(--muted);max-width:220px}
.att-chip img.thumb{width:40px;height:40px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}
.att-chip .f-ic{width:34px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:7px;color:var(--faint)}
.att-chip .f-ic .ic{width:16px;height:16px}
.att-chip .a-meta{overflow:hidden}
.att-chip .a-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-size:12px}
.att-chip .a-size{font-size:10px;color:var(--faint)}
.att-chip .a-x{border:none;background:none;color:var(--faint);cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
.att-chip .a-x:hover{color:var(--danger)}
/* 消息内图片附件 */
.msg-img{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg-img img{max-width:min(260px,80%);max-height:180px;border-radius:8px;border:1px solid var(--border);display:block}
.att-file-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin-top:6px}
.agent-status i{width:6px;height:6px;border-radius:50%;background:var(--ok);font-style:normal}
.agent-status.running i{background:var(--accent);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.agent-status.error i{background:var(--danger)}
.send-btn{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:6px 16px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.send-btn:hover{background:var(--accent-hover)}
.send-btn .ic{width:13px;height:13px}
.send-btn:disabled{opacity:.4;cursor:default}
.send-btn.stopping{background:var(--danger)}
.send-btn.stopping:hover{background:var(--danger-hover,#dc2626)}
.send-btn.stopping .sb-send{display:none}
.send-btn.stopping .sb-stop{display:flex !important;align-items:center;gap:5px}

/* ===== 设置弹窗（左侧导航） ===== */
.settings-mask{position:fixed;inset:0;background:rgba(24,24,27,.42);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center}
.settings-mask.show{display:flex}
.settings-modal{width:min(920px,94vw);height:min(660px,88vh);background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(24,24,27,.28);display:flex;overflow:hidden;animation:smIn .22s ease}
@keyframes smIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.sm-side{width:210px;flex-shrink:0;border-right:1px solid var(--border);background:#fbfbfc;display:flex;flex-direction:column}
.sm-side .sm-brand{display:flex;align-items:center;gap:9px;padding:18px 18px 12px}
.sm-side .sm-brand .logo{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--rose-ink,#12121a);overflow:hidden;box-shadow:0 1px 2px rgba(16,18,27,.16)}
.sm-side .sm-brand .logo .logo-mark{display:block}
.sm-side .sm-brand b{font-size:13px}
.sm-nav{flex:1;overflow-y:auto;padding:4px 8px}
.sm-nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13px;user-select:none}
.sm-nav-item:hover{background:var(--hover);color:var(--text)}
.sm-nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sm-nav-item .ic{width:16px;height:16px;flex-shrink:0}
.sm-nav-sep{height:1px;background:var(--border);margin:8px 12px}
.sm-main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.sm-x{position:absolute;top:14px;right:16px;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.sm-x:hover{background:var(--hover);color:var(--text)}
.sm-x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sm-title{padding:18px 24px 10px;font-size:16px;font-weight:600;border-bottom:1px solid var(--border)}
.sm-title small{display:block;font-size:11.5px;color:var(--faint);font-weight:400;margin-top:2px}
.sm-body{flex:1;overflow-y:auto;padding:20px 26px 30px}
.sp-section{margin-bottom:24px}
.sp-section h4{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;margin:0 0 10px;font-weight:600}
.sp-agents textarea{width:100%;min-height:200px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--mono);font-size:12.5px;line-height:1.7;resize:vertical;outline:none;color:var(--text);background:var(--panel)}
.sp-agents textarea:focus{border-color:var(--accent)}
.sp-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 0 0}
.sp-actions .save-msg{font-size:12px;color:var(--ok);align-self:center;margin-right:auto}
.sp-actions .save-msg.err{color:var(--danger)}
.key-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 10px;border-radius:999px}
.key-badge.set{color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-border)}
.key-badge.unset{color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-border)}
.key-badge.keyless{color:var(--accent);background:var(--accent-soft);border:1px solid #c7d7fb}
.btn-accent{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn-accent:hover{background:var(--accent-hover)}
.btn-accent:disabled{opacity:.5;cursor:default}
.btn-outline{border-radius:8px;padding:7px 16px;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit}
.btn-outline:hover{background:var(--hover)}
.spin-sm{width:13px;height:13px;border:2px solid #dbeafe;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}

.role-card{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.role-card .rc-h{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.role-card .rc-h:hover{background:var(--hover)}
.role-card .rc-icon{width:26px;height:26px;color:var(--muted)}
.role-card .rc-meta{flex:1;min-width:0}
.role-card .rc-name{font-size:13px;font-weight:600}
.role-card .rc-sub{font-size:11.5px;color:var(--faint);margin-top:1px}
.role-card .rc-ops{display:flex;gap:6px;opacity:0}
.role-card:hover .rc-ops{opacity:1}
.rc-op{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rc-op:hover{color:var(--text);background:var(--hover)}
.rc-op.del:hover{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.rc-op .ic{width:13px;height:13px}
.role-card .rc-b{padding:0 14px 14px;display:none}
.role-card.open .rc-b{display:block}
.role-editor .fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.role-editor label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.role-editor input[type=text],.role-editor select{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:13px;font-family:inherit;outline:none;background:var(--panel);color:var(--text)}
.role-editor input:focus,.role-editor select:focus{border-color:var(--accent)}
.role-editor .full{grid-column:1/-1}
.role-editor textarea{width:100%;min-height:110px;padding:9px 11px;border:1px solid var(--border-strong);border-radius:7px;font-size:12.5px;line-height:1.65;font-family:inherit;resize:vertical;outline:none}
.role-editor textarea:focus{border-color:var(--accent)}
.role-editor .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.add-role{width:100%;padding:10px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--panel);color:var(--muted);cursor:pointer;font-size:12.5px;font-family:inherit}
.add-role:hover{border-color:var(--accent);color:var(--accent)}
.add-role.new{width:auto;padding:8px 14px}
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.seclabel{display:flex;align-items:center;gap:10px}
.polish-btn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:1px solid #dbeafe;border-radius:7px;padding:4px 10px;cursor:pointer;font-family:inherit;margin-bottom:6px;white-space:nowrap}
.polish-btn:hover{background:#dbeafe}
.polish-btn:disabled{opacity:.6;cursor:default}
.polish-btn .ic{width:13px;height:13px}
.sec-head .polish-btn{margin:0}
.sp-section h4{flex:1}
/* ===== 模型配置页：可用模型列表 + 启用模型 chips ===== */
.mlist{margin-top:8px;border:1px solid var(--border);border-radius:8px;max-height:220px;overflow-y:auto;background:#fcfcfd;display:none}
.mlist:empty{display:none}
.mlist:not(:empty){display:block}
.ml-row{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--border)}
.ml-row:last-child{border-bottom:none}
.ml-row:hover{background:var(--hover)}
.ml-row input{accent-color:var(--accent)}
.ml-code{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.en-chips{display:flex;flex-wrap:wrap;gap:7px}
.en-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 6px 4px 11px;border:1px solid var(--accent);border-radius:999px;font-size:12px;color:var(--accent);background:var(--accent-soft)}
/* 已启用模型 chip：显示名 + 请求名（小字）+ 就地编辑态 */
.en-chip{flex-wrap:wrap}
.en-req{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--faint);background:var(--hover);border-radius:5px;padding:1px 5px;margin-left:2px}
.en-chip .en-name{cursor:text;border-bottom:1px dashed transparent}
.en-chip .en-name:hover{border-bottom-color:var(--border-strong)}
.en-chip.editing{gap:6px}
.en-input{width:180px;padding:3px 7px;border:1px solid var(--accent);border-radius:7px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);color:var(--text)}
.en-ok,.en-cancel{border:none;background:transparent;cursor:pointer;font-size:12px;padding:2px 4px;color:var(--faint)}
.en-ok{color:var(--accent)}
.en-ok:hover,.en-cancel:hover{color:var(--text)}
/* 手动添加请求名称 */
.req-add{display:flex;gap:8px;margin-top:8px}
.req-input{flex:1;padding:6px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);color:var(--text)}
.en-chip .en-name{color:var(--text)}
.en-chip .en-x{border:none;background:none;cursor:pointer;color:var(--faint);font-size:12px;padding:0 2px;line-height:1}
.en-chip .en-x:hover{color:var(--danger)}
/* ===== 模型配置：Provider 卡片 ===== */
.prov-card{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.prov-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.prov-head:hover{background:var(--hover)}
.prov-caret{color:var(--faint);font-size:11px;transition:transform .15s;flex-shrink:0}
.prov-card.open .prov-caret{transform:rotate(90deg)}
.prov-name{font-size:13px;font-weight:600;color:var(--text)}
.prov-meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint)}
.prov-del{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .12s,border-color .12s,background .12s}
.prov-del:hover{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.prov-del .ic{width:12px;height:12px}
/* 用量仪表 */
.usage-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.usage-card{border:1px solid var(--border);border-radius:12px;padding:13px 15px;background:var(--panel)}
.usage-card .uc-num{font-size:21px;font-weight:700;color:var(--accent);font-family:var(--mono)}
.usage-card .uc-lbl{font-size:11px;color:var(--faint);margin-top:3px}
.usage-row{display:flex;align-items:center;gap:11px;padding:5px 0}
.usage-row .ur-name{flex:0 0 190px;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usage-row .ur-bar{flex:1;height:9px;background:var(--hover);border-radius:999px;overflow:hidden}
.usage-row .ur-bar>div{height:100%;background:var(--accent);border-radius:999px}
.usage-row .ur-num{flex:0 0 64px;text-align:right;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.usage-days{display:flex;align-items:flex-end;gap:9px;padding:6px 2px}
.ud-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.ud-col .ud-bar{width:22px;background:var(--accent);border-radius:5px 5px 0 0;opacity:.85}
.ud-col .ud-lbl{font-size:9.5px;color:var(--faint)}
/* 通用图标关闭按钮（弹窗头部） */
.icon-x{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .12s,border-color .12s,background .12s}
.icon-x:hover{color:var(--text);border-color:var(--border-strong);background:var(--hover)}
.icon-x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.prov-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.prov-card.open .prov-body{display:block}
.prov-field{margin-top:10px}
.prov-field label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px;letter-spacing:.3px}
.prov-field input{width:100%;box-sizing:border-box;padding:8px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--panel);color:var(--text)}
.prov-field input:focus{border-color:var(--accent)}
.prov-fetch{display:flex;align-items:center;gap:9px;margin-top:10px}
.prov-fetch .hint{font-size:11px;color:var(--faint)}
.ml-filter{width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;outline:none;background:var(--panel);color:var(--text);margin-top:10px}
.ml-filter:focus{border-color:var(--accent)}
/* ===== 消息流：计划卡 / 询问选择框 / 思考卡 ===== */
.plan-card,.ask-card,.think-card{max-width:800px;margin:10px auto 0;border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.plan-card .th,.ask-card .th,.think-card .th{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;font-size:12px;color:var(--muted)}
.plan-card .th .caret,.think-card .th .caret{margin-left:auto;color:var(--faint);transition:transform .15s}
.plan-card.open .th .caret,.think-card.open .th .caret{transform:rotate(180deg)}
.plan-card{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan-card .th{color:var(--accent)}
.plan-body{padding:2px 14px 12px}
.plan-exp{font-size:11.5px;color:var(--faint);margin:6px 0}
.plan-step{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:12.5px;color:var(--text)}
.plan-step .ps-ic{flex-shrink:0;width:16px;text-align:center}
.plan-step.st-pending{color:var(--faint)}
.plan-step.st-inProgress .ps-ic{color:var(--accent)}
.plan-step.st-completed .ps-ic{color:var(--ok)}
.plan-step.st-completed span:last-child{color:var(--faint);text-decoration:line-through}
.ask-card .th .ic,.plan-card .th .ic{width:14px;height:14px;flex-shrink:0}
.plan-card .th .ic{color:var(--accent)}
.ask-opts{display:flex;flex-direction:column;gap:6px}
.ask-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--panel);cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s,background .12s}
.ask-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.ask-opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ask-opt .ao-label{font-size:12.5px;color:var(--text)}
.ask-opt.sel .ao-label{color:var(--accent);font-weight:600}
.ask-opt .ao-desc{font-size:11px;color:var(--faint)}
.ask-other{margin-top:7px}
.ask-other input{width:100%;box-sizing:border-box;padding:7px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;font-family:inherit;outline:none;background:var(--panel);color:var(--text)}
.ask-other input:focus{border-color:var(--accent)}
.ask-input{display:flex;gap:8px}
.ask-input input{flex:1;padding:7px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;font-family:inherit;outline:none;background:var(--panel);color:var(--text)}
.ask-input input:focus{border-color:var(--accent)}
/* 消息流中 ask 只读摘要行（交互在弹窗） */
.ask-summary{max-width:800px;margin:10px auto 0;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:8px 14px}
.ask-summary .th{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-bottom:5px}
.ask-summary .ic{width:13px;height:13px}
.as-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;font-size:12px}
.as-row .as-q{color:var(--text)}
.as-row .as-a{color:var(--ok);flex-shrink:0}
.as-row .as-a.pending{color:var(--faint)}
/* 提问弹窗内 */
.am-q{margin-bottom:4px}
.am-qt{font-size:13px;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ask-h{font-size:10.5px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:0 8px}
.am-foot{font-size:11.5px;color:var(--faint);text-align:right;margin-top:4px}
.think-card{border:none;margin:8px auto 0;max-width:800px}
.think-card .tk-head{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11.5px;color:var(--faint);cursor:pointer;user-select:none}
.think-card .tk-head:hover{color:var(--muted)}
.think-card .tk-dot{color:var(--accent);font-size:10px}
.think-card .tk-label{flex-shrink:0}
.think-card .tk-preview{flex:1;min-width:0;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.think-card .tk-caret{flex-shrink:0;transition:transform .15s}
.think-card.open .tk-caret{transform:rotate(180deg)}
.think-card .tk-body{display:none;font-size:11.5px;line-height:1.6;color:var(--faint);white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto;border-left:2px solid var(--border);padding-left:10px;margin:3px 0 6px;text-align:left}
.think-card.open .tk-body{display:block}
/* 会话模式选择：紧凑按钮 + 浮层下拉（零监管不作红色整块填充） */
.mode-pick{position:relative}
.mode-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-strong);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.mode-btn .mode-ic{color:var(--accent);font-size:11px}
.mode-btn[data-mode="free"] .mode-ic{color:var(--danger)}
.mode-btn .mode-arr{color:var(--faint);font-size:9px}
.mode-pop{position:absolute;right:0;bottom:calc(100% + 6px);width:230px;background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 -6px 24px rgba(24,24,27,.13);padding:5px;display:none;z-index:90}
.mode-pop.show{display:block}
.mode-opt{padding:8px 10px;border-radius:9px;cursor:pointer}
.mode-opt:hover{background:var(--hover)}
.mode-opt.cur{background:var(--accent-soft)}
.mode-opt .mo-title{font-size:12.5px;color:var(--text);font-weight:600}
.mode-opt[data-mode="free"] .mo-title{color:var(--danger)}
.mode-opt.cur .mo-title{color:var(--accent)}
.mode-opt.cur[data-mode="free"] .mo-title{color:var(--danger)}
.mode-opt .mo-desc{font-size:11px;color:var(--faint);margin-top:2px;line-height:1.4}
/* 厂商预设选择弹窗 */
.prov-pick{width:400px;max-width:90vw;max-height:72vh;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(24,24,27,.22)}
.pp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--border)}
.pp-list{flex:1;overflow-y:auto;padding:8px}
.pp-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:9px 11px;border:none;background:none;border-radius:9px;cursor:pointer;font-family:inherit;text-align:left}
.pp-item:hover{background:var(--hover)}
.pp-name{font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px}
.pp-name .pp-tag{font-style:normal;font-size:10px;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-border);border-radius:999px;padding:0 7px}
.pp-url{font-size:11px;color:var(--faint);font-family:var(--mono)}
.pp-foot{display:flex;justify-content:flex-end;gap:9px;padding:12px 16px;border-top:1px solid var(--border)}
/* ===== 技能面板 ===== */
.skills-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sk-filter{display:flex;gap:8px;margin:0 0 12px}
.sk-filter .sk-search,.sk-filter .sk-role{height:32px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font-family:inherit;font-size:12.5px;padding:0 10px;outline:none}
.sk-filter .sk-search{flex:1;min-width:0}
.sk-filter .sk-role{flex-shrink:0;max-width:180px;cursor:pointer}
.sk-filter .sk-search:focus,.sk-filter .sk-role:focus{border-color:var(--accent)}
.sk-filter .sk-search::placeholder{color:var(--faint)}
.skills-bar .sk-title{font-size:13px;font-weight:600}
.skill-card{border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px;background:var(--panel);height:auto;display:flex;flex-direction:column;overflow:hidden}
#skillList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mcpList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skill-card.off{opacity:.62}
.skill-head{display:flex;align-items:flex-start;gap:10px;flex:1;min-height:0}
.skill-ic{width:26px;height:26px;color:var(--muted);flex-shrink:0;margin-top:1px}
.skill-meta{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.skill-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.skill-name .nm{overflow:hidden;text-overflow:ellipsis}
.skill-tag{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--faint);flex-shrink:0}
.skill-desc{flex:1;min-height:0;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;white-space:nowrap;text-overflow:ellipsis;cursor:default}
.skill-del{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.skill-del:hover{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.skill-del .ic{width:13px;height:13px}
.skill-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:11px;gap:12px}
.skill-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.switch{position:relative;width:34px;height:19px;display:inline-block;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--border-strong);border-radius:999px;transition:.2s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:before{transform:translateX(15px)}
.skill-bind{font-size:12px;color:var(--text);border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:4px 8px;cursor:pointer;outline:none;font-family:inherit}
.skill-bind:hover{border-color:var(--accent)}
.import-menu{position:relative;display:inline-block}
.import-menu .im-list{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 8px 24px rgba(24,24,27,.12);padding:5px;z-index:70;display:none;min-width:150px}
.import-menu .im-list.show{display:block}
.im-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:none;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--text);text-align:left}
.im-item:hover{background:var(--hover)}
.im-item .ic{width:14px;height:14px;color:var(--muted)}
.sk-empty{padding:40px;text-align:center;color:var(--faint);font-size:13px;grid-column:1/-1}
.sk-act-note{font-size:11.5px;color:var(--faint);margin:-6px 0 12px}

/* ===== 本地对话框（替代浏览器原生 confirm/alert/prompt） ===== */
.dlg-mask{position:fixed;inset:0;background:rgba(24,24,27,.42);display:none;align-items:center;justify-content:center;z-index:1000}
.dlg-mask.show{display:flex;animation:fmIn .15s ease}
.modal-mask{position:fixed;inset:0;background:rgba(24,24,27,.45);display:none;align-items:center;justify-content:center;z-index:1200}
.modal-mask.show{display:flex;animation:fmIn .15s ease}
.modal{background:var(--panel);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 18px 50px rgba(24,24,27,.3);width:min(430px,92vw);display:flex;flex-direction:column;max-height:82vh;animation:smIn .18s ease}
.modal-head{display:flex;align-items:center;gap:8px;padding:15px 18px 0;font-size:13.5px;font-weight:600;color:var(--text)}
.modal-head .appr-title{flex:1;display:flex;align-items:center;gap:8px}
.modal-x{width:26px;height:26px;margin-left:auto;flex-shrink:0;border:none;background:transparent;color:var(--faint);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--hover);color:var(--text)}
.modal-x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.ask-modal .modal-head{justify-content:space-between}
.modal-body{overflow-y:auto;padding:12px 18px 4px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:14px 18px 16px}
.appr-ic{color:var(--warn);font-size:15px}
.appr-cmd{font-family:var(--mono);font-size:12px;background:var(--bg,#f8f8fa);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);white-space:pre-wrap;word-break:break-all;margin:8px 0 6px}
.appr-why{font-size:11.5px;color:var(--faint)}
.ask-modal .modal-body{display:flex;flex-direction:column;gap:12px}
.dlg{background:var(--panel);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 18px 50px rgba(24,24,27,.28);width:min(380px,92vw);padding:18px 20px;animation:smIn .18s ease}
.dlg-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dlg-title .ic{width:16px;height:16px;color:var(--danger)}
.dlg-body{font-size:13px;color:var(--muted);line-height:1.65;white-space:pre-line;word-break:break-word}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.dlg-btn{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 15px;font-size:13px;cursor:pointer;font-family:inherit}
.dlg-btn:hover{background:var(--hover)}
.dlg-btn.danger{border-color:transparent;background:var(--danger);color:#fff}
.dlg-btn.danger:hover{opacity:.9}
.dlg-btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.dlg-btn.primary:hover{opacity:.9}
/* ===== 记忆面板（可折叠区块） ===== */
.mem-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:8px}
.mem-actions .save-msg{font-size:12px;color:var(--ok);margin-right:auto}
@keyframes fmIn{from{opacity:0}to{opacity:1}}
.empty{margin:88px auto;text-align:center;color:var(--faint);font-size:13.5px;letter-spacing:.3px}

/* ================= 视觉精修层（taste polish · 蓝色调 · 宽松密度） ================= */
/* ---- 浮层/下拉：统一样式 =---- */
.role-picker,.skill-picker,.mode-pop,.import-menu .im-list,.prov-pick{box-shadow:var(--shadow-md)}
.role-picker,.skill-picker,.import-menu .im-list{border-radius:14px}
.role-picker,.skill-picker{border-color:transparent}
.mode-pop{border-radius:14px}
.rp-title,.sp-title{letter-spacing:.6px;font-weight:600}
.rp-item,.mode-opt,.im-item,.pp-item{border-radius:9px}
.rp-item:hover,.sp-item:hover,.mode-opt:hover,.im-item:hover,.pp-item:hover{background:var(--hover)}

/* ---- 侧栏 ---- */
.sidebar{background:linear-gradient(180deg,#fbfbfd,#f7f8fb)}
.brand .logo{background:var(--rose-ink,#12121a);border:0;box-shadow:0 4px 12px -3px rgba(0,0,0,.35)}
.brand small{letter-spacing:.2px}
.new-chat{border-radius:var(--radius);transition:border-color .16s ease,color .16s ease,background .16s ease,transform .16s ease,box-shadow .16s ease}
.new-chat:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);box-shadow:0 4px 12px -5px rgba(37,99,235,.45)}
.new-chat:active{transform:translateY(0)}
.rg-head{border-radius:10px;transition:background .15s ease}
/* hover 位移(transform)会让 .new-chat 自建层叠上下文，把内部 role-picker 困住、盖不过后面的搜索栏；
   显式 z-index 抬升整层（低于 .settings-mask 60 / .dlg 1000），下拉即可浮在搜索栏与会话列表之上 */
.new-chat{z-index:40}
.role-picker{z-index:80}
.session-item{border-radius:10px;transition:background .15s ease,color .15s ease,box-shadow .15s ease}
.session-item:hover{background:var(--panel);box-shadow:var(--shadow-xs)}
.session-item.active{background:linear-gradient(90deg,#eaf0ff,#e4ebff);box-shadow:inset 0 0 0 1px rgba(37,99,235,.22)}
.session-item .name{letter-spacing:.1px}
.session-empty{color:var(--faint)}
.sess-search{border-radius:10px;transition:border-color .15s ease,background .15s ease,box-shadow .18s ease}
.sess-search:focus-within{background:var(--panel);box-shadow:var(--ring)}

/* ---- 顶栏 ---- */
.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar .title{font-weight:650;letter-spacing:.2px}
.role-tag{font-weight:500}
.pill{background:#fff;box-shadow:var(--shadow-xs);font-weight:500}
.agent-status i{box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.agent-status.running i{box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.agent-status.error i{box-shadow:0 0 0 3px rgba(220,38,38,.16)}

/* ---- 聊天气泡 / 消息区 ---- */
.wrap{max-width:820px}
.msg .avatar{width:34px;height:34px;border-radius:11px;margin-top:2px}
.msg .avatar.u{background:linear-gradient(135deg,#eceff6,#dfe4ef);color:#39405a;font-weight:700;box-shadow:var(--shadow-xs)}
.msg .avatar.a{background:linear-gradient(135deg,#f0f4ff,#e3ebff);border:1px solid rgba(37,99,235,.30);color:var(--accent)}
.msg .avatar.a .ic{width:18px;height:18px}
.msg .who{font-weight:650;letter-spacing:.1px}
.msg .meta .time{font-family:var(--mono);font-size:10.5px;letter-spacing:.2px;opacity:.85}
.msg .body{line-height:1.78}
.msg .body a{text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(37,99,235,.3)}
.gen .avatar{border-radius:11px;background:linear-gradient(135deg,#f0f4ff,#e3ebff);border:1px solid rgba(37,99,235,.30);color:var(--accent)}

/* ---- 消息卡（工具/计划/思考/询问摘要/错误） ---- */
.tool-card{border-radius:var(--radius);box-shadow:var(--shadow-xs)}
.tool-card .th{background:linear-gradient(180deg,#fff,#fafbfe)}
.tool-card .st{font-weight:600}
.tool-card .tb{background:#fbfbfd}
.plan-card,.ask-summary{border-radius:var(--radius);box-shadow:var(--shadow-xs)}
.think-card .tk-head .tk-dot{color:var(--accent)}
.think-card .tk-preview{color:var(--muted)}
.err-row{border-radius:10px}

/* ---- 输入区 ---- */
.composer .box{border-radius:var(--radius-lg);box-shadow:0 1px 2px rgba(22,28,45,.03),var(--shadow-xs);transition:border-color .16s ease,box-shadow .2s ease}
.composer .box:focus-within{border-color:var(--accent);box-shadow:var(--ring),var(--shadow-xs)}
.model-select,.attach-btn,.skill-btn{border-radius:9px}
.model-select{box-shadow:var(--shadow-xs)}

/* ---- 按钮主次 ---- */
.btn,.btn-outline,.btn-accent,.dlg-btn,.icon-x,.prov-del,.skill-del,.rc-op,.rg-op{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .18s ease,transform .12s ease}
.btn-accent,.send-btn{background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 5px 14px -6px rgba(37,99,235,.55)}
.btn-accent:hover:not(:disabled),.send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -6px rgba(37,99,235,.65)}
.btn-accent:active:not(:disabled),.send-btn:active:not(:disabled){transform:translateY(0)}
.send-btn{border-radius:10px;font-weight:600}
.send-btn.stopping{background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0));background-color:var(--danger);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 5px 14px -6px rgba(220,38,38,.5)}
.send-btn.stopping:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px -6px rgba(220,38,38,.6)}
.btn-outline:hover{background:var(--hover)}

/* ---- 卡片 / 设置面板 / 弹窗 ---- */
.prov-card,.role-card,.skill-card{box-shadow:var(--shadow-xs)}
.prov-card,.role-card,.skill-card{transition:border-color .16s ease,box-shadow .18s ease}
.prov-card:hover,.role-card:hover,.skill-card:hover{border-color:var(--border-strong)}
.prov-card.open{box-shadow:var(--shadow-sm)}
.settings-modal{border-radius:18px;box-shadow:var(--shadow-lg)}
.sm-side{background:linear-gradient(180deg,#fbfbfd,#f6f7fb)}
.sm-nav-item{border-radius:9px;transition:background .15s ease,color .15s ease}
.sm-nav-item.active{background:linear-gradient(90deg,#e9efff,#e2eaff);box-shadow:inset 0 0 0 1px rgba(37,99,235,.20)}
.sm-title{font-weight:650;letter-spacing:.2px}
.sm-side .sm-brand small{letter-spacing:.3px}
.sp-section h4{letter-spacing:1px}
.sp-agents textarea{transition:border-color .15s ease,box-shadow .18s ease}
.sp-agents textarea:focus{box-shadow:var(--ring);border-color:var(--accent)}
.modal,.dlg,.prov-pick{border-radius:16px}
.modal,.dlg{box-shadow:var(--shadow-lg)}
.mem-actions .btn-accent{padding:6px 15px}

/* 记忆面板（折叠，默认收起） */
.mem-item{border:1px solid var(--border);border-radius:12px;background:var(--panel);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-xs)}
.mem-item .mem-head{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;user-select:none}
.mem-item .mem-head:hover{background:var(--hover)}
.mem-item .mem-head b{font-size:13px;font-weight:600}
.mem-item .mem-head em{font-style:normal;font-size:11.5px;color:var(--faint);margin-left:2px}
.mem-item .mem-head .rico{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.mem-caret{color:var(--faint);font-size:11px;display:inline-block;transition:transform .15s;flex-shrink:0}
.mem-item.open .mem-caret{transform:rotate(90deg)}
.mem-item .mem-body{display:none;border-top:1px solid var(--border);padding:12px 14px 14px}
.mem-item.open .mem-body{display:block}
.mem-sub{font-size:12px;color:var(--muted);margin:14px 2px 10px;font-weight:500}
.mem-ta{width:100%;box-sizing:border-box;min-height:140px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;font-family:var(--mono);font-size:12.5px;line-height:1.7;resize:vertical;outline:none;background:var(--panel);color:var(--text);transition:border-color .15s,box-shadow .18s}
.mem-ta:focus{border-color:var(--accent);box-shadow:var(--ring)}
.skill-card .skill-toggle,.mcp-card{user-select:none}

/* ---- 用量条 / chips / 开关 微色彩 ---- */
.usage-card{box-shadow:var(--shadow-xs)}
.usage-card .uc-num{background:linear-gradient(135deg,#3b82f6,#1d4ed8);-webkit-background-clip:text;background-clip:text;color:transparent}
.ur-bar>div,.ud-bar{background:linear-gradient(90deg,#4f8bff,#2563eb)}
.en-chip,.sk-chip,.skill-tag{letter-spacing:.2px}
.sl{box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}


/* ========== 深色主题（由 JS 在 <html> 上设置 data-theme="dark"） ========== */
html[data-theme="dark"]{
  --bg:#14171d; --panel:#191d24; --hover:#20252e; --active:#2a303c;
  --border:#2c323e; --border-strong:#3e4655;
  --text:#e7e9ef; --muted:#9aa3b2; --faint:#6a7282;
  --accent:#5b8cff; --accent-hover:#4c7ef8; --accent-soft:rgba(91,140,255,.15);
  --ok:#34d399; --ok-soft:rgba(16,185,129,.15); --ok-border:rgba(52,211,153,.32);
  --warn:#fbbf24; --warn-soft:rgba(245,158,11,.16); --warn-border:rgba(251,191,36,.32);
  --danger:#f87171;
  --shadow-xs:0 1px 2px rgba(0,0,0,.45);
  --shadow-sm:0 2px 8px -2px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px -6px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.5);
  --shadow-lg:0 18px 48px -10px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(91,140,255,.28);
  --focus:rgba(91,140,255,.6);
  color-scheme:dark;
}
html[data-theme="dark"] body{color:var(--text);background:var(--bg)}
html[data-theme="dark"] .sidebar,html[data-theme="dark"] .sm-side{background:var(--panel)}
html[data-theme="dark"] .topbar{background:rgba(25,29,36,.9)}
html[data-theme="dark"] .pill{background:var(--panel)}
html[data-theme="dark"] .topbar .role-tag{border-color:rgba(91,140,255,.35)}
html[data-theme="dark"] .sm-nav-item.active{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(91,140,255,.25)}
html[data-theme="dark"] .settings-mask,html[data-theme="dark"] .dlg-mask,html[data-theme="dark"] .modal-mask{background:rgba(0,0,0,.62)}
html[data-theme="dark"] .usage-card .uc-num{background:linear-gradient(135deg,#6ea0ff,#4c7ef8)}
html[data-theme="dark"] select option{background:#191d24;color:var(--text)}


html[data-theme="dark"] .session-item.active{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(91,140,255,.22)}
html[data-theme="dark"] .msg .avatar.u{background:linear-gradient(135deg,#2a2f3a,#343b47);color:#e7e9ef}
html[data-theme="dark"] .msg .avatar.a,html[data-theme="dark"] .gen .avatar{background:linear-gradient(135deg,rgba(91,140,255,.30),rgba(91,140,255,.16));border:1px solid rgba(91,140,255,.38)}
html[data-theme="dark"] .tool-card .th{background:linear-gradient(180deg,#1b1f28,#181c24)}
html[data-theme="dark"] .tool-card .tb{background:#10131a;color:var(--text)}
html[data-theme="dark"] .err-row{background:rgba(220,38,38,.13);border-color:rgba(248,113,113,.35)}


html[data-theme="dark"] .mlist{background:var(--panel)}
html[data-theme="dark"] .ml-row{color:var(--text)}
html[data-theme="dark"] textarea{background:var(--panel);color:var(--text)}

/* Windows 沙箱横幅（仅 win32 且 readiness 非 ready 时显示） */
.sb-banner{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:9px 13px;border:1px solid rgba(217,119,6,.4);border-radius:11px;background:rgba(217,119,6,.10);color:var(--text);font-size:12.5px}
.sb-banner[hidden]{display:none}
.sb-banner .sb-ic{font-size:14px;line-height:1}
.sb-banner .sb-text{flex:1;min-width:0}
.sb-banner .sb-act{padding:5px 11px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font-size:12px;cursor:pointer;font-family:inherit}
.sb-banner .sb-act[disabled]{opacity:.6;cursor:default}
.sb-banner .sb-x{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 4px}
.sb-banner .sb-x:hover{color:var(--text)}
html[data-theme="dark"] .sb-banner{background:rgba(217,119,6,.16);border-color:rgba(251,191,36,.35)}

/* 环境自检结果行 */
.env-row{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:var(--panel);font-size:12.5px}
.env-row .env-mark{flex:0 0 14px;text-align:center;font-weight:700}
.env-row.ok .env-mark{color:#16a34a}
.env-row.warn .env-mark{color:#d97706}
.env-row.fail .env-mark{color:#dc2626}
.env-row .env-id{flex:0 0 118px;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.env-row .env-body{flex:1;min-width:0;word-break:break-all}
.env-row .env-hint{display:block;color:var(--faint);font-size:11.5px;margin-top:3px}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg class="logo-mark" viewBox="0 0 512 512" width="100%" height="100%" aria-label="ROSE" role="img"><g fill="none" stroke="#F4F1EA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path d="M200 146 V366"/><path d="M200 146 A58 58 0 0 1 200 262"/></g><path d="M200 262 L308 366" fill="none" stroke="#D16A80" stroke-width="32" stroke-linecap="round"/></svg></div>
      <div><b>ROSE</b></div>
    </div>
    <div class="new-chat" id="newChat">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span data-i18n="newChat">新会话</span>
      <div class="role-picker" id="rolePicker"></div>
    </div>
    <div class="sess-search">
      <span class="ic ss-ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input id="sessSearch" type="text" placeholder="搜索会话…" data-i18n-ph="searchPh" spellcheck="false" autocomplete="off">
      <button class="ss-clear" id="sessSearchClear" title="清除" data-i18n-title="search.clear" hidden>✕</button>
    </div>
    <div class="session-scroll" id="roleGroups"></div>
    <div class="sidebar-foot">
      <button class="settings-btn" id="settingsBtn">
        <span class="ic gear-rot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
        <span data-i18n="settingsBtn">设置</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="ic cicon" id="topIcon"></span>
      <div>
        <div class="title" id="topTitle">ROSE</div>
        <div class="sub">
          <span class="role-tag" id="topRole">—</span>
        </div>
      </div>
      <div class="right">
        <span class="pill agent-status" id="agentStatus"><i></i><span id="agentStatusText">就绪</span></span>
      </div>
    </div>

    <!-- Windows 沙箱横幅：readiness 非 ready 时由 app.js 显示（绝不静默失去隔离） -->
    <div class="sb-banner" id="sandboxBanner" hidden>
      <span class="sb-ic">⚠</span>
      <span class="sb-text" id="sandboxBannerText"></span>
      <button class="sb-act" id="sandboxBannerSetup" hidden>初始化沙箱</button>
      <button class="sb-x" id="sandboxBannerClose" title="稍后再说">✕</button>
    </div>

    <div class="chatroom" id="chatroom">
      <div class="wrap" id="feed"></div>
    </div>

    <div class="composer">
      <div class="box">
        <textarea id="input" rows="2" placeholder="发消息…（⏎ 发送 / ⇧⏎ 换行）" data-i18n-ph="inputPh"></textarea>
        <div class="att-picks" id="attPicks"></div>
        <div class="att-picks" id="skillPicks"></div>
        <div class="bar">
          <button class="attach-btn" id="attachBtn" title="上传图片 / 文件" data-i18n-title="att.upload">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
          </button>
          <input type="file" id="fileInput" multiple hidden accept="image/*,.txt,.md,.json,.js,.ts,.jsx,.tsx,.py,.css,.html,.htm,.csv,.yaml,.yml,.toml,.xml,.log,.java,.go,.rs,.c,.h,.cpp,.sh,.sql,.pdf,.doc,.docx,.xls,.xlsx,.zip">
          <button class="attach-btn skill-btn" id="skillBtn" title="选用技能" data-i18n-title="skill.choose">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="m5 5 4 4M15 5l4 4M5 15l4 4M15 15l4 4"/></svg></span><span class="skill-count" id="skillCount">0</span>
          </button>
          <div class="skill-picker" id="skillPicker"></div>
          <div class="right">
            <div class="mode-pick" id="modePick">
              <button class="mode-btn" id="modeBtn" type="button" title="选择会话模式" data-i18n-title="mode.select"><span class="mode-ic" id="modeIc">⚙</span><span id="modeLbl">默认</span><span class="mode-arr">▾</span></button>
              <div class="mode-pop" id="modePop">
                <div class="mode-opt" data-mode="plan"><div class="mo-title" data-i18n="mode.planT">✦ 计划模式</div><div class="mo-desc" data-i18n="mode.planD">只读研究 · 产出计划 · 确认后实施（复杂任务建议）</div></div>
                <div class="mode-opt" data-mode="default"><div class="mo-title" data-i18n="mode.defaultT">默认模式</div><div class="mo-desc" data-i18n="mode.defaultD">可写工作区 · 命令需审批 · 大改动前先说明方案</div></div>
                <div class="mode-opt" data-mode="free"><div class="mo-title" data-i18n="mode.freeT">零监管模式</div><div class="mo-desc" data-i18n="mode.freeD">完全访问 · 自动执行 · 不审批（仅信任模型时使用）</div></div>
              </div>
            </div>
            <select class="model-select" id="modelSelect" title="选择本次对话使用的模型" data-i18n-title="model.select"></select>
            <button class="send-btn" id="sendBtn" title="发送（⏎）"><span class="sb-send"><span data-i18n="sendBtn">发送</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></span></span><span class="sb-stop" style="display:none"><span data-i18n="stopBtn">■ 停止</span></span></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div class="settings-mask" id="settingsMask">
  <div class="settings-modal">
    <div class="sm-side">
      <div class="sm-brand">
        <div class="logo"><svg class="logo-mark" viewBox="0 0 512 512" width="100%" height="100%" aria-label="ROSE" role="img"><g fill="none" stroke="#F4F1EA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path d="M200 146 V366"/><path d="M200 146 A58 58 0 0 1 200 262"/></g><path d="M200 262 L308 366" fill="none" stroke="#D16A80" stroke-width="32" stroke-linecap="round"/></svg></div>
        <div><b data-i18n="settings">设置</b><small style="display:block;font-size:10.5px;color:var(--faint);font-weight:400" data-i18n="sm.sub">配置</small></div>
      </div>
      <div class="sm-nav" id="smNav">
        <div class="sm-nav-item active" data-nav="model">
          <span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M17 2l-1.5 5M7 2l1.5 5M12 7V2"/></svg></span>
          <div data-i18n="nav.model">模型配置</div>
        </div>
        <div class="sm-nav-item" data-nav="prompt">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h7"/></svg></span>
          <div data-i18n="nav.prompt">全局提示词</div>
        </div>
        <div class="sm-nav-item" data-nav="memory">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v17l-6.5-3.2L5 21V4a1 1 0 0 1 1-1Z"/><path d="M8.5 8.5h7M8.5 12.5h7"/></svg></span>
          <div data-i18n="nav.memory">记忆</div>
        </div>
        <div class="sm-nav-sep"></div>
        <div class="sm-nav-item" data-nav="roles">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <div data-i18n="nav.roles">角色管理</div>
        </div>
        <div class="sm-nav-item" data-nav="skills">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="m5 5 4 4M15 5l4 4M5 15l4 4M15 15l4 4"/></svg></span>
          <div data-i18n="nav.skills">技能</div>
        </div>
        <div class="sm-nav-item" data-nav="mcp">
          <span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="6" height="6" rx="1"/><rect x="16" y="9" width="6" height="6" rx="1"/><path d="M8 12h8"/></svg></span>
          <div data-i18n="nav.mcp">MCP 工具</div>
        </div>
        <div class="sm-nav-sep"></div>
        <div class="sm-nav-item" data-nav="usage">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg></span>
          <div data-i18n="nav.usage">用量</div>
        </div>
        <div class="sm-nav-sep"></div>
        <div class="sm-nav-item" data-nav="general">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg></span>
          <div data-i18n="nav.general">通用</div>
        </div>
        <div class="sm-nav-item" data-nav="env">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <div data-i18n="nav.env">环境与诊断</div>
        </div>
      </div>
    </div>
    <div class="sm-main">
      <button class="sm-x" id="settingsClose" title="关闭" data-i18n-title="dlg.close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="sm-title" id="smTitle">模型配置</div>
      <div class="sm-body" id="smBody"><!-- 由 app.js 渲染 --></div>
    </div>
  </div>
</div>

<!-- 本地对话框（替代浏览器原生 confirm/alert/prompt） -->
<div class="dlg-mask" id="dlgMask">
  <div class="dlg">
    <div class="dlg-title" id="dlgTitle"></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-actions" id="dlgActions"></div>
  </div>
</div>

<!-- 审批弹窗：工具/命令权限申请（独立于消息流） -->
<div class="modal-mask" id="apprMask">
  <div class="modal appr-modal">
    <div class="modal-head"><span class="appr-title"></span><button class="modal-x" id="apprClose" title="" data-i18n-title="dlg.closeDeny"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body"></div>
    <div class="modal-actions"><button class="btn ghost-deny" id="apprDeny" data-i18n="appr.deny">拒绝</button><button class="btn pri" id="apprAllow" data-i18n="appr.allow">允许</button></div>
  </div>
</div>

<!-- 提问弹窗：模型向你提的多个问题（独立于消息流） -->
<div class="modal-mask" id="askModalMask">
  <div class="modal ask-modal">
    <div class="modal-head"><span style="flex:1" data-i18n="ask.title">需要你的选择</span><button class="modal-x" id="askModalClose" title="" data-i18n-title="dlg.closeSkip"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body" id="askModalBody"></div>
    <div class="modal-actions"><button class="btn-accent" id="askModalSubmit" data-i18n="ask.submit">提交回答</button></div>
  </div>
</div>

<!-- 新增模型配置：厂商预设选择（带滚动） -->
<div class="dlg-mask" id="provPickMask">
  <div class="prov-pick">
    <div class="pp-head"><span data-i18n="model.addProvTitle">新增模型配置 · 选择厂商预设</span><button class="icon-x" id="provPickClose" title="关闭" data-i18n-title="dlg.close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="pp-list" id="provPickList"></div>
    <div class="pp-foot"><button class="btn-outline" id="provPickCancel" data-i18n="common.cancel">取消</button></div>
  </div>
</div>

<!-- 新增/编辑 MCP 服务器弹窗 -->
<div class="dlg-mask" id="mcpEditMask">
  <div class="prov-pick" style="width:470px">
    <div class="pp-head"><span id="mcpEditTitle" data-i18n="mcpUI.title">新增 MCP 服务器</span><button class="icon-x" id="mcpEditClose" title="" data-i18n-title="dlg.close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="pp-list" style="padding:14px 16px;overflow-y:auto">
      <div class="prov-field"><label data-i18n="mcpUI.type">服务器类型</label>
        <select id="mcpType" style="width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--text)">
          <option value="stdio" data-i18n="mcpUI.typeStdio">本地进程（stdio：uvx / npx / node 命令）</option>
          <option value="http" data-i18n="mcpUI.typeHttp">远程 · Streamable HTTP（填 URL）</option>
          <option value="sse" data-i18n="mcpUI.typeSse">远程 · SSE（旧式 HTTP+SSE，填 URL）</option>
        </select></div>
      <div class="prov-field"><label data-i18n="mcpUI.name">名称（唯一）</label><input type="text" id="mcpName" placeholder="例如 my-server" data-i18n-ph="mcpUI.namePh"></div>
      <div id="mcpStdioFields">
        <div class="prov-field"><label>Command</label><input type="text" id="mcpCommand" placeholder="uvx / npx / node …"></div>
        <div class="prov-field"><label data-i18n="mcpUI.args">参数（空格分隔，可空）</label><input type="text" id="mcpArgs" placeholder="mcp-server-fetch"></div>
        <div class="prov-field"><label data-i18n="mcpUI.env">环境变量（每行 KEY=VALUE，可空）</label><textarea id="mcpEnv" rows="2" style="width:100%;box-sizing:border-box;padding:8px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:12px;font-family:var(--mono);outline:none;background:var(--panel);color:var(--text);resize:vertical"></textarea></div>
      </div>
      <div id="mcpRemoteFields" style="display:none">
        <div class="prov-field"><label>URL</label><input type="text" id="mcpUrl" placeholder="https://host/mcp"></div>
        <div class="prov-field"><label data-i18n="mcpUI.headers">请求头（每行 Key: Value，可空；鉴权如 Authorization: Bearer xxx）</label><textarea id="mcpHeaders" rows="3" style="width:100%;box-sizing:border-box;padding:8px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:12px;font-family:var(--mono);outline:none;background:var(--panel);color:var(--text);resize:vertical"></textarea></div>
      </div>
      <div class="prov-field"><label data-i18n="mcpUI.scope">绑定范围</label>
        <select id="mcpScope" style="width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--text)">
          <option value="global">全局（所有角色可用）</option>
        </select></div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:12px">
        <button class="btn-outline" id="mcpTestBtn" style="padding:5px 12px;font-size:12px" data-i18n="mcpUI.test">测试连接</button>
        <span class="hint" id="mcpTestMsg" style="font-size:11px;color:var(--faint)"></span>
      </div>
    </div>
    <div class="pp-foot"><button class="btn-outline" id="mcpEditCancel" data-i18n="common.cancel">取消</button><button class="btn-accent" id="mcpEditSave" data-i18n="common.save">保存</button></div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
